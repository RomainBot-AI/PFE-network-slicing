skip_existing: true
make_reports: true
comparison_output_dir: reports

runs:
  - id: prophet_hist1d
    kind: prophet
    config: configs/experiment/prophet_benchmark_tuned_hist1d.yaml
    output_dir: experiments/runs/prophet_benchmark_tuned_hist1d
  - id: prophet_hist1w
    kind: prophet
    config: configs/experiment/prophet_benchmark_tuned_hist1w.yaml
    output_dir: experiments/runs/prophet_benchmark_tuned_hist1w
  - id: lightgbm_hist1d
    kind: deterministic
    config: configs/experiment/deterministic_benchmark_lightgbm_tuned_hist1d.yaml
    output_dir: experiments/runs/deterministic_benchmark_lightgbm_tuned_hist1d
  - id: lightgbm_hist1w
    kind: deterministic
    config: configs/experiment/deterministic_benchmark_lightgbm_tuned_hist1w.yaml
    output_dir: experiments/runs/deterministic_benchmark_lightgbm_tuned_hist1w
  - id: lstm_hist1d
    kind: lstm
    config: configs/experiment/lstm_benchmark_5000w_hist1d.yaml
    output_dir: experiments/runs/lstm_benchmark_5000w_hist1d
  - id: lstm_hist1w
    kind: lstm
    config: configs/experiment/lstm_benchmark_5000w_hist1w.yaml
    output_dir: experiments/runs/lstm_benchmark_5000w_hist1w
  - id: nhits_hist1d
    kind: nhits
    config: configs/experiment/nhits_benchmark_tuned_hist1d.yaml
    output_dir: experiments/runs/nhits_benchmark_tuned_hist1d
  - id: nhits_hist1w
    kind: nhits
    config: configs/experiment/nhits_benchmark_tuned_hist1w.yaml
    output_dir: experiments/runs/nhits_benchmark_tuned_hist1w
  - id: patchtst_hist1d
    kind: patchtst
    config: configs/experiment/patchtst_benchmark_tuned_hist1d.yaml
    output_dir: experiments/runs/patchtst_benchmark_tuned_hist1d
  - id: patchtst_hist1w
    kind: patchtst
    config: configs/experiment/patchtst_benchmark_tuned_hist1w.yaml
    output_dir: experiments/runs/patchtst_benchmark_tuned_hist1w
