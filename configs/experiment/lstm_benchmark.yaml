seed: 42

data:
  panel_csv: traffic_forecasting/data/subnet_slice_traffic_min2016_dense.csv
  frequency: 10min

backtest:
  mode: rolling_origin
  expanding: false
  input_size: 2016
  horizon: 36
  step_size: 144
  n_folds: 5
  fold_stride: 144

training:
  params_path: experiments/runs/lstm_tuning/lstm_best_params_by_slice.yaml
  train_origin_stride: 288
  max_windows_per_slice: 2500
  device: auto

output:
  output_dir: experiments/runs/lstm_benchmark
