seed: 42

data:
  panel_csv: traffic_forecasting/data/subnet_slice_traffic_min2016_dense.csv
  frequency: 10min

backtest:
  mode: rolling_origin
  expanding: false
  input_size: 2016
  horizon: 36
  step_size: 144
  n_folds: 5
  fold_stride: 144

tuning:
  n_trials: 20
  objective: MASE
  validation_fraction: 0.2
  train_origin_stride: 288
  max_windows_per_slice: 2500
  max_epochs: 20
  patience: 4
  device: auto

output:
  output_dir: experiments/runs/lstm_tuning
