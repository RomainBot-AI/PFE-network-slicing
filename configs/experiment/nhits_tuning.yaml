seed: 42

data:
  panel_csv: traffic_forecasting/data/subnet_slice_traffic_min2016_dense.csv
  frequency: 10min

backtest:
  mode: rolling_origin
  expanding: false
  input_size: 2016
  horizon: 36
  step_size: 144
  n_folds: 5
  fold_stride: 144

tuning:
  n_trials: 12
  objective: MASE
  max_steps_range: [100, 500]
  learning_rate_range: [0.0001, 0.005]
  batch_size_choices: [16, 32, 64]
  windows_batch_size_choices: [512, 1024, 2048]
  step_size_choices: [144, 288, 576]
  mlp_width_choices: [128, 256, 512]
  n_blocks_choices: [1, 2]
  max_dropout: 0.2

base_model:
  scaler_type: standard
  stack_types: [identity, identity, identity]
  n_pool_kernel_size: [2, 2, 1]
  n_freq_downsample: [4, 2, 1]
  val_check_steps: 50
  early_stop_patience_steps: -1

training:
  device: auto
  slices: []

output:
  output_dir: experiments/runs/nhits_tuning
