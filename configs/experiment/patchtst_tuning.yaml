seed: 42

data:
  panel_csv: traffic_forecasting/data/subnet_slice_traffic_min2016_dense.csv
  frequency: 10min

backtest:
  mode: rolling_origin
  expanding: false
  input_size: 2016
  horizon: 36
  step_size: 144
  n_folds: 1
  fold_stride: 144

base_model:
  max_steps: 100
  learning_rate: 0.0005
  batch_size: 32
  windows_batch_size: 512
  inference_windows_batch_size: 512
  step_size: 288
  scaler_type: standard
  encoder_layers: 2
  n_heads: 4
  hidden_size: 64
  linear_hidden_size: 128
  dropout: 0.2
  fc_dropout: 0.2
  head_dropout: 0.0
  attn_dropout: 0.0
  patch_len: 32
  stride: 16
  revin: true
  revin_affine: false
  revin_subtract_last: true
  activation: gelu
  res_attention: true
  batch_normalization: false
  learn_pos_embed: true
  val_check_steps: 25
  early_stop_patience_steps: -1

training:
  device: auto
  slices: []

tuning:
  objective: MASE
  candidates:
    - name: fast_reference
      max_steps: 100
      learning_rate: 0.0005
      hidden_size: 64
      linear_hidden_size: 128
      encoder_layers: 2
      n_heads: 4
      patch_len: 32
      stride: 16
      dropout: 0.2
      fc_dropout: 0.2
      windows_batch_size: 512
      val_check_steps: 25
    - name: more_steps
      max_steps: 180
      learning_rate: 0.0003
      hidden_size: 64
      linear_hidden_size: 128
      encoder_layers: 2
      n_heads: 4
      patch_len: 32
      stride: 16
      dropout: 0.2
      fc_dropout: 0.2
      windows_batch_size: 512
      val_check_steps: 45
    - name: lower_dropout
      max_steps: 140
      learning_rate: 0.0005
      hidden_size: 64
      linear_hidden_size: 128
      encoder_layers: 2
      n_heads: 4
      patch_len: 32
      stride: 16
      dropout: 0.1
      fc_dropout: 0.1
      windows_batch_size: 512
      val_check_steps: 35
    - name: smaller_patch
      max_steps: 120
      learning_rate: 0.0005
      hidden_size: 64
      linear_hidden_size: 128
      encoder_layers: 2
      n_heads: 4
      patch_len: 24
      stride: 12
      dropout: 0.2
      fc_dropout: 0.2
      windows_batch_size: 512
      val_check_steps: 30
    - name: modest_capacity
      max_steps: 120
      learning_rate: 0.0004
      hidden_size: 80
      linear_hidden_size: 160
      encoder_layers: 2
      n_heads: 4
      patch_len: 32
      stride: 16
      dropout: 0.2
      fc_dropout: 0.2
      windows_batch_size: 512
      val_check_steps: 30

output:
  output_dir: experiments/runs/patchtst_tuning
