seed: 42

data:
  panel_csv: traffic_forecasting/data/subnet_slice_traffic_min2016_dense.csv
  frequency: 10min

backtest:
  mode: rolling_origin
  expanding: false
  input_size: 144
  horizon: 3
  step_size: 144
  n_folds: 1
  fold_stride: 144

model:
  name: deepar
  quantiles: [0.1, 0.5, 0.9]
  distribution: Normal
  max_steps: 1
  learning_rate: 0.001
  batch_size: 8
  windows_batch_size: 32
  step_size: 12
  scaler_type: standard
  lstm_n_layers: 1
  lstm_hidden_size: 16
  lstm_dropout: 0.0
  decoder_hidden_layers: 0
  decoder_hidden_size: 0
  trajectory_samples: 20
  num_samples: 20
  val_check_steps: 1
  early_stop_patience_steps: -1

training:
  device: auto
  slices: [mMTC]
  seasonal_scale_period: 1

output:
  run_dir: experiments/runs/probabilistic_deepar_smoke
