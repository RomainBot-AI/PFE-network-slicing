seed: 42

data:
  panel_csv: traffic_forecasting/data/subnet_slice_traffic_min2016_dense.csv
  frequency: 10min

backtest:
  mode: rolling_origin
  expanding: false
  input_size: 144
  horizon: 36
  step_size: 144
  n_folds: 5
  fold_stride: 144

model:
  family: nhits
  name: nhits_quantile
  quantiles: [0.1, 0.5, 0.9]
  max_steps: 300
  learning_rate: 0.001
  batch_size: 32
  windows_batch_size: 1024
  step_size: 288
  scaler_type: standard
  stack_types: [identity, identity, identity]
  n_blocks: [1, 1, 1]
  mlp_units:
    - [256, 256]
    - [256, 256]
    - [256, 256]
  n_pool_kernel_size: [2, 2, 1]
  n_freq_downsample: [4, 2, 1]
  dropout_prob_theta: 0.0
  val_check_steps: 50
  early_stop_patience_steps: -1

training:
  device: auto
  slices: []
  params_path: experiments/runs/nhits_tuning/nhits_best_params_by_slice.yaml
  seasonal_scale_period: 144

output:
  run_dir: experiments/runs/probabilistic_nhits_1d
