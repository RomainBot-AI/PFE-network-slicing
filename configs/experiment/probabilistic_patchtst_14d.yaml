seed: 42

data:
  panel_csv: traffic_forecasting/data/subnet_slice_traffic_min2016_dense.csv
  frequency: 10min

backtest:
  mode: rolling_origin
  expanding: false
  input_size: 2016
  horizon: 36
  step_size: 144
  n_folds: 5
  fold_stride: 144

model:
  family: patchtst
  name: patchtst_quantile
  quantiles: [0.1, 0.5, 0.9]
  max_steps: 100
  learning_rate: 0.0005
  batch_size: 32
  windows_batch_size: 512
  inference_windows_batch_size: 512
  step_size: 288
  scaler_type: standard
  encoder_layers: 2
  n_heads: 4
  hidden_size: 64
  linear_hidden_size: 128
  dropout: 0.2
  fc_dropout: 0.2
  head_dropout: 0.0
  attn_dropout: 0.0
  patch_len: 32
  stride: 16
  revin: true
  revin_affine: false
  revin_subtract_last: true
  activation: gelu
  res_attention: true
  batch_normalization: false
  learn_pos_embed: true
  val_check_steps: 25
  early_stop_patience_steps: -1

training:
  device: auto
  slices: []
  params_path: experiments/runs/patchtst_tuning/patchtst_best_params.yaml
  seasonal_scale_period: 144

output:
  run_dir: experiments/runs/probabilistic_patchtst_14d
