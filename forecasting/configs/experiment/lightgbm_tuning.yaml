seed: 42

data:
  panel_csv: forecasting/data/subnet_slice_traffic_min2016_dense.csv
  frequency: 10min

backtest:
  mode: rolling_origin
  expanding: false
  input_size: 2016
  horizon: 36
  step_size: 144
  n_folds: 5
  fold_stride: 144

features:
  seasonal_scale_period: 144
  train_origin_stride: 36
  lags:
    - 1
    - 2
    - 3
    - 6
    - 12
    - 36
    - 144
    - 1008

tuning:
  n_trials: 20
  objective: MASE
  validation_fraction: 0.2

base_params:
  n_jobs: 1
  verbosity: -1

output:
  output_dir: forecasting/experiments/runs/lightgbm_tuning
