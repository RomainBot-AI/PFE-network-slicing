seed: 42

data:
  panel_csv: forecasting/data/subnet_slice_traffic_min2016_dense.csv
  frequency: 10min

backtest:
  mode: rolling_origin
  expanding: false
  input_size: 288
  horizon: 3
  step_size: 144
  n_folds: 2
  fold_stride: 144

features:
  seasonal_scale_period: 144
  train_origin_stride: 12
  lags:
    - 1
    - 2
    - 3
    - 6
    - 12
    - 36
    - 144

tuning:
  n_trials: 3
  objective: MASE
  validation_fraction: 0.2

base_params:
  n_jobs: 1
  verbosity: -1

output:
  output_dir: forecasting/experiments/runs/lightgbm_tuning_smoke
