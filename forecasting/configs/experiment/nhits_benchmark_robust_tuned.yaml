seed: 42

data:
  panel_csv: forecasting/data/subnet_slice_traffic_min2016_dense.csv
  frequency: 10min

backtest:
  mode: rolling_origin
  expanding: false
  input_size: 2016
  horizon: 36
  step_size: 144
  n_folds: 5
  fold_stride: 144

model:
  max_steps: 300
  learning_rate: 0.001
  batch_size: 32
  windows_batch_size: 1024
  step_size: 288
  scaler_type: robust
  stack_types: [identity, identity, identity]
  n_blocks: [1, 1, 1]
  mlp_units:
    - [128, 128]
    - [128, 128]
    - [128, 128]
  n_pool_kernel_size: [2, 2, 1]
  n_freq_downsample: [4, 2, 1]
  dropout_prob_theta: 0.1
  val_check_steps: 50
  early_stop_patience_steps: -1

training:
  device: auto
  slices: []
  params_path: forecasting/experiments/runs/nhits_tuning_robust/nhits_best_params_by_slice.yaml

output:
  output_dir: forecasting/experiments/runs/nhits_benchmark_robust_tuned
