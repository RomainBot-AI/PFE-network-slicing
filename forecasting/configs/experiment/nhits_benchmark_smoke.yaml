seed: 42

data:
  panel_csv: forecasting/data/subnet_slice_traffic_min2016_dense.csv
  frequency: 10min

backtest:
  mode: rolling_origin
  expanding: false
  input_size: 2016
  horizon: 36
  step_size: 144
  n_folds: 1
  fold_stride: 144

model:
  max_steps: 1
  learning_rate: 0.001
  batch_size: 8
  windows_batch_size: 32
  step_size: 288
  scaler_type: standard
  stack_types: [identity]
  n_blocks: [1]
  mlp_units:
    - [32, 32]
  n_pool_kernel_size: [2]
  n_freq_downsample: [1]
  dropout_prob_theta: 0.0
  val_check_steps: 1
  early_stop_patience_steps: -1

training:
  device: auto
  slices: [mMTC]

output:
  output_dir: forecasting/experiments/runs/nhits_benchmark_smoke
