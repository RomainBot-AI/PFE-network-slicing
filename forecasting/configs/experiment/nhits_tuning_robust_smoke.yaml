seed: 42

data:
  panel_csv: forecasting/data/subnet_slice_traffic_min2016_dense.csv
  frequency: 10min

backtest:
  mode: rolling_origin
  expanding: false
  input_size: 2016
  horizon: 36
  step_size: 144
  n_folds: 5
  fold_stride: 144

tuning:
  n_trials: 1
  objective: MASE
  internal_validation_folds: 2
  internal_fold_stride: 144
  max_steps_range: [1, 1]
  learning_rate_range: [0.001, 0.001]
  batch_size_choices: [8]
  windows_batch_size_choices: [32]
  step_size_choices: [288]
  mlp_width_choices: [32]
  n_blocks_choices: [1]
  max_dropout: 0.0

base_model:
  scaler_type: robust
  stack_types: [identity]
  n_pool_kernel_size: [2]
  n_freq_downsample: [1]
  val_check_steps: 1
  early_stop_patience_steps: -1

training:
  device: auto
  slices: [mMTC]

output:
  output_dir: forecasting/experiments/runs/nhits_tuning_robust_smoke
