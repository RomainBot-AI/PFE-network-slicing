seed: 42

data:
  panel_csv: forecasting/data/subnet_slice_traffic_min2016_dense.csv
  frequency: 10min

backtest:
  mode: rolling_origin
  expanding: false
  input_size: 144
  horizon: 36
  step_size: 144
  n_folds: 5
  fold_stride: 144

model:
  name: deepar
  quantiles: [0.1, 0.5, 0.9]
  distribution: Normal
  max_steps: 100
  learning_rate: 0.001
  batch_size: 32
  windows_batch_size: 512
  step_size: 12
  scaler_type: standard
  lstm_n_layers: 1
  lstm_hidden_size: 64
  lstm_dropout: 0.1
  decoder_hidden_layers: 0
  decoder_hidden_size: 0
  trajectory_samples: 200
  num_samples: 200
  val_check_steps: 50
  early_stop_patience_steps: -1

training:
  device: auto
  slices: []
  seasonal_scale_period: 1

output:
  run_dir: forecasting/experiments/runs/probabilistic_deepar_1d
