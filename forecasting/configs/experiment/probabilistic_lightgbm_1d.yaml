seed: 42

data:
  panel_csv: forecasting/data/subnet_slice_traffic_min2016_dense.csv
  frequency: 10min

backtest:
  mode: rolling_origin
  expanding: false
  input_size: 144
  horizon: 36
  step_size: 144
  n_folds: 5
  fold_stride: 144

features:
  seasonal_scale_period: 1
  train_origin_stride: 12
  lags:
    - 1
    - 2
    - 3
    - 6
    - 12
    - 36
    - 72

model:
  name: lightgbm_quantile
  quantiles: [0.1, 0.5, 0.9]
  params:
    training_scope: per_slice
    slice_params_path: forecasting/experiments/runs/lightgbm_tuning/lightgbm_best_params_by_slice.yaml

output:
  run_dir: forecasting/experiments/runs/probabilistic_lightgbm_1d
