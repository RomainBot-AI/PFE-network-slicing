seed: 42

data:
  panel_csv: forecasting/data/subnet_slice_traffic_min2016_dense.csv
  frequency: 10min

backtest:
  mode: rolling_origin
  expanding: false
  input_size: 2016
  horizon: 36
  step_size: 144
  n_folds: 5
  fold_stride: 144

model:
  name: prophet_interval
  quantiles: [0.1, 0.5, 0.9]
  daily_seasonality: true
  weekly_seasonality: true
  yearly_seasonality: false
  seasonality_mode: additive
  changepoint_prior_scale: 0.05
  seasonality_prior_scale: 10.0
  interval_width: 0.8
  log_transform: true

training:
  slices: []
  max_series_per_slice:
  train_tail:
  params_path: forecasting/experiments/runs/prophet_tuning/prophet_best_params.yaml
  seasonal_scale_period: 144

output:
  run_dir: forecasting/experiments/runs/probabilistic_prophet_14d
