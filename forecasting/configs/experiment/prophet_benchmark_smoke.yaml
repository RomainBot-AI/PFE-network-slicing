seed: 42

data:
  panel_csv: forecasting/data/subnet_slice_traffic_min2016_dense.csv
  frequency: 10min

backtest:
  mode: rolling_origin
  expanding: false
  input_size: 2016
  horizon: 36
  step_size: 144
  n_folds: 1
  fold_stride: 144

model:
  daily_seasonality: true
  weekly_seasonality: true
  yearly_seasonality: false
  seasonality_mode: additive
  changepoint_prior_scale: 0.05
  seasonality_prior_scale: 10.0
  interval_width: 0.8
  log_transform: true

training:
  slices: [mMTC]
  max_series_per_slice: 2
  train_tail:

output:
  output_dir: forecasting/experiments/runs/prophet_benchmark_smoke
