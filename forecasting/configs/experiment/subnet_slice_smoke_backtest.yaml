seed: 42

data:
  panel_csv: forecasting/data/subnet_slice_traffic_min2016_dense.csv
  frequency: 10min

backtest:
  mode: rolling_origin
  expanding: false
  input_size: 144
  horizon: 3
  step_size: 144
  n_folds: 2
  fold_stride: 144

models:
  - name: persistence
  - name: seasonal_naive_daily
    params:
      seasonal_period: 144

output:
  run_dir: forecasting/experiments/runs/subnet_slice_smoke_backtest
