[project]
name = "dataset-creation"
version = "0.1.0"
description = "5G/6G RAN Network Slicing Simulator & PPO Agent"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0,<2.0.0",
    "torch>=2.0.0",
    "matplotlib>=3.7.0",
    "scikit-learn>=1.2.0",
    "scipy>=1.10.0",
    "lightgbm>=4.7.0",
    "prophet>=1.1.5",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
